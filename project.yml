name: VersionHistoryLab
options:
  bundleIdPrefix: org.education
  deploymentTarget:
    iOS: "17.0"
targets:
  VersionHistoryLab:
    type: application
    platform: iOS
    sources:
      - path: Sources/VersionHistoryLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.education.versionhistorylab
        PRODUCT_NAME: Version History Lab
        INFOPLIST_KEY_CFBundleDisplayName: Version History Lab
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
